[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surfacesignal"
version = "0.2.0"
description = "Exploratory NISAR GCOV change-analysis backend"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic-settings", "uvicorn", "numpy", "h5py", "rasterio", "pyproj", "shapely", "scipy", "pillow", "httpx", "asf-search"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
surfacesignal = "surfacesignal.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["external: requires network and optional Earthdata credentials"]
addopts = "-m 'not external'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Long scientific descriptions/URLs; formatter controls code layout.
